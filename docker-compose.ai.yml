# Local development substrate for the AI assistant (MIU 2a).
#
# Production runs on CloudRun; this reproduces the *shape* of that runtime
# locally — container process, ports, health checks, environment, graceful
# shutdown — so the store, state machine and race suites have something real to
# run against without buying anything.
#
# It deliberately does NOT reproduce: CloudRun's managed gateway, the CORS edge,
# scale-to-zero cold starts, VPC attachment, TLS termination, managed pooling,
# quotas or billing. Those stay deployed integration tests
# (architecture §14: "production-shaped, not production-equivalent").
#
#   docker compose -f docker-compose.ai.yml up -d postgres
#   node scripts/probe-ai-store.mjs --url postgres://ai:ai@localhost:55432/ai_assistant
#
# The BFF and worker services are commented out until MIU 2a creates those
# packages. Leaving them uncommented would make `up` fail on a missing build
# context, which reads as "the substrate is broken" rather than "not built yet".

name: channel-ai

# PORT RULE: every published port here is in the 5xxxx range.
# This machine already runs other project stacks, and low ports collide: 5432
# was taken by another Postgres, 4321/4322/4323 by stale Astro servers, and 3001
# by an unrelated node service. A collision does not fail loudly — docker
# compose exited 0 while the container never started, so the failure looked
# like success. High ports keep this stack's problems its own.

services:
  postgres:
    image: postgres:16
    container_name: channel-ai-postgres
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: ai_assistant
      # LLD-001 §4.4 requires READ COMMITTED. Postgres defaults to it, but the
      # store probe (S1) asserts it rather than trusting the default, because a
      # managed provider can ship a different default and the failure mode is a
      # takeover returning a 500 instead of a clean conflict.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    # 55432, not 5432: developers on this team already run other Postgres
    # containers (a stale one was found squatting ports during MIU 0), and a
    # port clash here looks like a database fault.
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai_assistant"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ai-pgdata:/var/lib/postgresql/data

  # Uncomment as MIU 2a creates each package.
  #
  # ai-bff:
  #   build:
  #     context: .
  #     dockerfile: apps/ai-bff/Dockerfile
  #   environment:
  #     DATABASE_URL: postgres://ai:ai@postgres:5432/ai_assistant
  #     PORT: "8080"
  #     CORS_ALLOWED_ORIGINS: http://localhost:4321
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #
  # ai-worker:
  #   build:
  #     context: .
  #     dockerfile: apps/ai-worker/Dockerfile
  #   environment:
  #     DATABASE_URL: postgres://ai:ai@postgres:5432/ai_assistant
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  # Retrieval + chat engine for local development (see
  # docs/ai-platform/ENGINE-EVALUATION-ANYTHINGLLM.md).
  #
  # The DOCKER image, never the desktop build: the desktop build ships
  # closed-source telemetry, which is disqualifying for anything that will see
  # customer questions.
  #
  # Secrets come from a gitignored .env.ai file, never from this file and never
  # from the command line (a key on argv is visible in `ps` to every process on
  # the machine). Create it from .env.ai.example.
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: channel-ai-anythingllm
    env_file:
      - .env.ai
    environment:
      STORAGE_DIR: /app/server/storage
      # zenmux is OpenAI-compatible, so the "generic OpenAI" provider is the
      # right adapter — no zenmux-specific plugin needed.
      LLM_PROVIDER: generic-openai
      GENERIC_OPEN_AI_BASE_PATH: https://zenmux.ai/api/v1
      GENERIC_OPEN_AI_MODEL_PREF: z-ai/glm-5.2
      # Reasoning models spend completion budget on reasoning before emitting a
      # single visible token. 30 tokens produced an EMPTY answer in testing;
      # Kimi K3 spent 103 reasoning tokens on a one-sentence reply. Keep real
      # headroom or visitors get blank replies with no error.
      GENERIC_OPEN_AI_MAX_TOKENS: "4096"
      EMBEDDING_ENGINE: native
      VECTOR_DB: lancedb
      DISABLE_TELEMETRY: "true"
    ports:
      # 53001, not 3001 — see the port rule at the top of this file.
      - "53001:3001"
    volumes:
      - ai-anythingllm:/app/server/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/api/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  ai-pgdata:
  ai-anythingllm:
