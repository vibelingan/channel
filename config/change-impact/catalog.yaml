schemaVersion: catalog-change-impact-v1
updatedAt: 2026-08-24T00:00:00Z

scanRoots:
  - apps
  - packages
  - scripts

layers:
  domain:
    include:
      - packages/shared/src/catalog/**
    forbidPackages:
      - react
      - astro:*
    forbidLayers:
      - infrastructure
      - application
      - presentation
      - family
      - route
  infrastructure:
    include:
      - apps/functions/public-api/src/catalog/**
      - apps/site/src/catalog/infrastructure/**
    forbidPackages:
      - react
    forbidLayers:
      - application
      - presentation
      - family
      - route
  application:
    include:
      - apps/site/src/catalog/application/**
    forbidPackages:
      - react
      - astro:*
    forbidLayers:
      - family
      - route
  presentation:
    include:
      - apps/site/src/catalog/presentation/**
    forbidPackages: []
    forbidLayers:
      - family
      - route
  family:
    include:
      - apps/site/src/catalog/families/**
    forbidPackages:
      - react
      - astro:*
    forbidLayers:
      - application
      - presentation
      - route
  route:
    include:
      - apps/site/src/islands/shop/CatalogFamilyPage.tsx
      - apps/site/src/pages/headphones.astro
      - apps/site/src/pages/ai-gadgets.astro
      - apps/site/src/pages/toys.astro
      - apps/site/src/pages/misc.astro
      - apps/site/src/pages/products/item.astro
    forbidPackages: []
    forbidLayers: []

# Layer/discovery configuration is validated against the verifier's immutable
# catalog-change-impact-v1 schema. File denominators derive from MIU docs,
# registry references, compatibility ownership, and the source import graph.
governanceOwners:
  - role: architecture-verifier
    path: scripts/verify-catalog-architecture.mjs
    miu: "01"
    discover:
      roots: [scripts]
      declarationNames: [verifyCatalogArchitecture]
  - role: public-catalog-schema
    path: packages/shared/src/catalog/index.ts
    miu: "02"
    discover:
      roots: [packages/shared/src/catalog]
      declarationNames: [PublicProductSchema, CatalogPageSchema]
  - role: public-read-normalizer
    path: packages/shared/src/catalog/normalize-public-product.ts
    miu: "03"
    discover:
      roots: [packages/shared/src/catalog]
      declarationNames: [normalizePublicProduct]
  - role: public-api-projection
    path: apps/functions/public-api/src/catalog/project-public-product.ts
    miu: "04"
    discover:
      roots: [apps/functions/public-api/src/catalog]
      declarationNames: [projectPublicProduct]
  - role: browser-catalog-decoder
    path: apps/site/src/catalog/infrastructure/catalog-api.ts
    miu: "05"
    discover:
      roots: [apps/site/src/catalog/infrastructure]
      declarationNames: [fetchCatalogPage]
  - role: alibaba-pricing-adapter
    path: packages/shared/src/catalog/alibaba-pricing-adapter.ts
    miu: "06"
    discover:
      roots: [packages/shared/src/catalog]
      declarationNames: [createAlibabaPricingAdapter]
  - role: pricing-resolver
    path: packages/shared/src/catalog/resolve-pricing.ts
    miu: "07"
    discover:
      roots: [packages/shared/src/catalog]
      declarationNames: [resolveCatalogPricing]
  - role: family-adapter-contract
    path: apps/site/src/catalog/families/catalog-family-adapter.ts
    miu: "15"
    discover:
      roots: [apps/site/src/catalog/families]
      declarationNames: [CatalogFamilyAdapter]
  - role: family-registry
    path: apps/site/src/catalog/families/registry.ts
    miu: "20"
    discover:
      roots: [apps/site/src/catalog/families]
      declarationNames: [getCatalogFamilyAdapter]
  - role: catalog-list-state
    path: apps/site/src/catalog/application/catalog-list-state.ts
    miu: "21"
    discover:
      roots: [apps/site/src/catalog/application]
      declarationNames: [createCatalogListState]
  - role: family-route-composition
    path: apps/site/src/islands/shop/CatalogFamilyPage.tsx
    miu: "22"
    discover:
      roots: [apps/site/src/islands/shop]
      declarationNames: [CatalogFamilyPage]
  - role: legacy-catalog-delegation
    path: apps/site/src/islands/shop/api.ts
    miu: "36"
  - role: catalog-knowledge-authority
    path: docs/ENGINEERING_CRAFT.md
    miu: "37"
    discover:
      roots: [docs]
      filePatterns:
        - docs/ENGINEERING_CRAFT.md
        - docs/knowledge/catalog/**
