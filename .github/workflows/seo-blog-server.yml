name: Blog server HTTP acceptance
on:
  push:
    branches: [feat/seo-foundation]
  pull_request:
    paths:
      - 'apps/site/**'
      - 'packages/articles/**'
      - 'packages/db/**'
      - 'apps/functions/public-api/**'
      - 'scripts/blog/server-http.integration.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/seo-blog-server.yml'
permissions:
  contents: read
jobs:
  server-http:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SITE_URL: https://supplychainsai.com
      BLOG_SSR_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix tools/hermes-blog --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix tools/cloud-handoff --ignore-scripts --no-audit --no-fund
      - run: node tools/cloud-handoff/check-runtime.mjs
      - run: node --test tools/cloud-handoff/transport.integration.mjs
      - run: npm test --prefix tools/hermes-blog
      - name: Verify source workspace, replay recovery, and private draft relay
        run: python3 -m unittest discover -s tools/hermes-blog -p 'test_relay.py'
      - name: Check the content-only installer without changing assistant configuration
        run: python3 -m unittest discover -s tools/hermes-blog/content-kit -p 'test_*.py'
      - name: Package only the content assistant skill and installation guide
        run: python3 tools/hermes-blog/content-kit/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-blog-content-kit-${{ github.sha }}
          path: output/channel-blog-content-kit-2026-10-27.zip
          if-no-files-found: error
      - name: Check KB replay and key rotation through the actual SDK offline transport
        run: pnpm --filter @vibelingan-channel/db exec tsx --test ../../tools/hermes-blog/kb-store.integration.mjs
      - run: ./apps/functions/article-import/node_modules/.bin/tsup --config tools/hermes-blog/tsup.config.mjs
      - uses: actions/setup-node@v4
        with: {node-version: 20.19.0}
      - run: node --test tools/hermes-blog/bundle.integration.mjs tools/hermes-blog/formal-bundle.integration.mjs tools/hermes-blog/relay-bundle.integration.mjs
      - uses: actions/setup-node@v4
        with: {node-version: 22.13.0}
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-blog-tool-${{ github.sha }}
          path: output/hermes-blog-bundle/channel-blog-mcp.mjs
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-blog-maintenance-${{ github.sha }}
          path: |
            output/hermes-blog-bundle/channel-blog-invoke.mjs
            tools/hermes-blog/locked-invoke.py
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-blog-relay-${{ github.sha }}
          path: |
            output/hermes-blog-bundle/channel-blog-relay.mjs
            output/hermes-blog-bundle/channel-blog-invoke.mjs
            tools/hermes-blog/relay.py
            tools/hermes-blog/locked-invoke.py
          if-no-files-found: error
      - run: pnpm --filter @vibelingan-channel/articles test
      - run: pnpm --filter @vibelingan-channel/db exec tsx --test src/article-public-reader.test.ts
      - run: pnpm --filter @vibelingan-channel/site build:blog-server
      - run: node scripts/blog/package-server.mjs output/blog-server-package
      - uses: actions/upload-artifact@v4
        with:
          name: blog-server-${{ github.sha }}
          path: output/blog-server-package
          if-no-files-found: error
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @vibelingan-channel/db exec tsx --test ../../scripts/blog/server-http.integration.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blog-server-browser-${{ github.sha }}
          path: output/blog-server-http
          if-no-files-found: ignore
