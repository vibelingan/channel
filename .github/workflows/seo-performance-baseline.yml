name: SEO performance baseline (read only)
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Before or After measurement
        type: choice
        required: true
        default: before
        options: [before, after]
      scope:
        description: All public page types or four affected image pages
        type: choice
        required: true
        default: all
        options: [all, image-pages]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        profile: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned tool in temporary directory
        run: npm install --prefix "$RUNNER_TEMP/lighthouse" --ignore-scripts --no-audit --no-fund lighthouse@13.0.1
      - name: Measure public pages from verified US egress; no deployment or credentials
        env:
          LIGHTHOUSE_CLI: ${{ runner.temp }}/lighthouse/node_modules/lighthouse/cli/index.js
          MEASUREMENT_PHASE: ${{ inputs.phase }}
          MEASUREMENT_SCOPE: ${{ inputs.scope }}
        run: node scripts/performance/us-lighthouse.mjs '${{ matrix.profile }}' "$MEASUREMENT_PHASE" "$MEASUREMENT_SCOPE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-${{ inputs.phase }}-${{ inputs.scope }}-${{ matrix.profile }}-${{ github.run_id }}
          path: performance-evidence/
          retention-days: 30
