name: Controlled formal site delivery
on:
  workflow_call:
    inputs:
      action: {type: string, required: true}
      product_source: {type: string, required: false, default: fresh}
      fault: {type: string, required: false, default: none}
      article_task_id: {type: string, required: false, default: ''}
      restore_run_id: {type: string, required: false, default: ''}
    secrets:
      TENCENTCLOUD_SECRETID: {required: true}
      TENCENTCLOUD_SECRETKEY: {required: true}
permissions:
  contents: read
  actions: read
jobs:
  site:
    if: ${{ (github.ref == 'refs/heads/feat/seo-foundation' || github.ref == 'refs/heads/test') && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: test
    env:
      CI: 'true'
      TCB_ENV_ID: ${{ vars.TCB_ENV_ID }}
      CLOUDBASE_REGION: ${{ vars.CLOUDBASE_REGION || 'ap-shanghai' }}
      SITE_URL: ${{ vars.SITE_URL }}
      PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL || format('https://{0}.service.tcloudbase.com', vars.TCB_ENV_ID) }}
      PUBLIC_AI_API_BASE_URL: ${{ vars.PUBLIC_AI_API_BASE_URL }}
      PUBLIC_CATALOG_READY_DEFAULT: ${{ vars.PUBLIC_CATALOG_READY_DEFAULT || '0' }}
      PUBLIC_CB_PROXY: '0'
      SITE_DELIVERY_CONFIRM: FORMAL_SITE_ONLY
      SITE_DELIVERY_MODE: ${{ inputs.action }}
      SITE_PRODUCT_SOURCE: ${{ inputs.product_source }}
      SITE_DELIVERY_FAULT: ${{ inputs.fault }}
      SITE_ARTICLE_TASK_ID: ${{ inputs.article_task_id }}
      SITE_RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: pnpm/action-setup@v4
        with: {version: 11.5.0, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.13.0, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Install real public acceptance browser before cloud writes
        run: pnpm exec playwright install --with-deps chromium
      - name: Collect, build, archive, publish and verify under the existing shared queue
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
        with:
          script: |
            const { spawn } = require('node:child_process');
            await new Promise((resolve, reject) => {
              const child = spawn('./apps/site/node_modules/.bin/tsx', ['scripts/run-site-delivery.ts'], {stdio:'inherit', env:process.env});
              child.once('error', reject);
              child.once('exit', code => code === 0 ? resolve() : reject(new Error(`Controlled site delivery stopped (${code})`)));
            });
      - name: Retain actual delivery result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-delivery-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/site-delivery/result.json
            output/site-delivery/before/recovery-manifest.json
            output/site-delivery/public-browser/
          if-no-files-found: ignore
          retention-days: 90
