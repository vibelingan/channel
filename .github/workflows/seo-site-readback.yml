name: Continue final site acceptance without website writes
on:
  workflow_call:
    inputs:
      source_run_id: {type: string, required: true}
    secrets:
      TENCENTCLOUD_SECRETID: {required: true}
      TENCENTCLOUD_SECRETKEY: {required: true}
permissions:
  contents: read
  actions: read
jobs:
  readback:
    if: ${{ github.ref == 'refs/heads/feat/seo-foundation' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: test
    env:
      TCB_ENV_ID: ${{ vars.TCB_ENV_ID }}
      CLOUDBASE_REGION: ${{ vars.CLOUDBASE_REGION || 'ap-shanghai' }}
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_READBACK_CONFIRM: FINAL_READ_ONLY
      SITE_READBACK_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: pnpm/action-setup@v4
        with: {version: 11.5.0, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.13.0, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify original files, configuration and actual browser before accepting
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
        run: node scripts/run-site-readback.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-readback-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/site-readback/result.json
            output/site-delivery/public-browser/
          if-no-files-found: error
          retention-days: 90
