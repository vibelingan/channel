name: CI

on:
  pull_request:
  push:
    branches:
      - test
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: 'true'
      PUBLIC_CB_PROXY: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify CloudBase SDK contract
        run: pnpm verify:cloudbase-sdk

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Package CloudBase functions
        run: pnpm package:functions

      - name: Smoke function artifacts
        run: pnpm smoke:functions

      - name: Build site
        run: pnpm build

      - name: Scan built site for server secret names
        run: |
          if grep -R -I -n -E 'JWT_SECRET|ADMIN_PASSWORD_HASH|BOOTSTRAP_ADMIN_TOKEN|EMAIL_PASSWORD|EMAIL_USER|TENCENTCLOUD_SECRET(ID|KEY)|TENCENTCLOUD_SESSIONTOKEN' apps/site/dist; then
            echo "Server secret names were found in the public site build." >&2
            exit 1
          fi

      - name: Discover Playwright specs
        run: pnpm test:e2e --list
