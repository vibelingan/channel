name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - test
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: 'true'
      PUBLIC_CB_PROXY: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify CloudBase SDK contract
        run: pnpm verify:cloudbase-sdk

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Package CloudBase functions
        run: pnpm package:functions

      - name: Set up deployed function runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: Smoke function artifacts on deployed runtime
        env:
          CHANNEL_EXPECTED_RELEASE: ${{ github.sha }}
        run: node scripts/smoke-function-artifacts.mjs

      - name: Restore site build runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Build site
        run: pnpm build

      - name: Scan built site for server secret names
        run: |
          if grep -R -I -n -E 'JWT_SECRET|ADMIN_PASSWORD_HASH|BOOTSTRAP_ADMIN_TOKEN|EMAIL_PASSWORD|EMAIL_USER|TENCENTCLOUD_SECRET(ID|KEY)|TENCENTCLOUD_SESSIONTOKEN|ALI_APP_KEY|ALI_APP_SECRET|ALI_OAUTH_CALLBACK_URL|ALI_TOKEN_ENCRYPTION_KEY_V1|WECOM_WEBHOOK_URL' apps/site/dist; then
            echo "Server secret names were found in the public site build." >&2
            exit 1
          fi

      - name: Discover Playwright specs
        run: pnpm test:e2e --list

      - name: Install Playwright Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Exercise built catalog and Admin with an isolated local database
        env:
          # Only synthetic local credentials/data exist in this owned fixture lane.
          E2E_RECORD_ARTIFACTS: '1'
        run: pnpm test:e2e:catalog-admin-local

      - name: Exercise approved details and inquiry follow-up on ordinary routes
        env:
          E2E_RECORD_ARTIFACTS: '1'
          E2E_CATALOG_FORMAL: '1'
        run: pnpm test:e2e:catalog-admin-local

      - name: Preserve failed local browser evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: catalog-local-browser-${{ github.sha }}
          path: output/playwright/
          retention-days: 7
          if-no-files-found: ignore
