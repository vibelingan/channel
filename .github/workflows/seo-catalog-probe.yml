name: Isolated real CloudBase catalog check
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    if: ${{ github.ref == 'refs/heads/feat/seo-foundation' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: test
    env:
      TCB_ENV_ID: ${{ vars.TCB_ENV_ID }}
      CLOUDBASE_REGION: ${{ vars.CLOUDBASE_REGION || 'ap-shanghai' }}
      SEO_PROBE_CONFIRM: ISOLATED_CATALOG_ONLY
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: pnpm/action-setup@v4
        with: {version: 11.5.0, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.13.0, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Exercise production code against isolated real SDK collections
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
        run: ./apps/site/node_modules/.bin/tsx scripts/run-catalog-seo-probe.ts
      - name: Keep actual result and exact source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-seo-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/catalog-seo-probe/result.json
          if-no-files-found: warn
          retention-days: 90
