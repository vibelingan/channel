name: Repair catalog image delivery
on:
  workflow_call:
    inputs:
      operation:
        type: string
        default: prepare
      expected_package:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  responsive:
    if: ${{ github.ref == 'refs/heads/feat/seo-foundation' && github.event_name == 'workflow_dispatch' && inputs.operation == 'responsive' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    env:
      CATALOG_RESPONSIVE_CONFIRM: PREPARE_SELECTED_SIZES_ONLY
      IMAGE_EXPECTED_PROGRAM: ${{ inputs.expected_package }}
      TCB_ENV_ID: diversity-123-d9grnqfux221323bb
      CLOUDBASE_REGION: ap-shanghai
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.13.0', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Add verified sizes only to the reviewed existing photographs
        run: ./packages/db/node_modules/.bin/tsx scripts/images/prepare-responsive-ci.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-image-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/responsive-image-preparation/
          if-no-files-found: ignore
          retention-days: 90
  prepare:
    if: ${{ github.ref == 'refs/heads/feat/seo-foundation' && github.event_name == 'workflow_dispatch' && (inputs.operation == 'prepare' || inputs.operation == 'api-only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    env:
      IMAGE_DELIVERY_CONFIRM: ${{ inputs.operation == 'api-only' && 'UPDATE_PUBLIC_API_ONLY' || 'PREPARE_WEB_IMAGES_AND_PUBLIC_API_ONLY' }}
      IMAGE_EXPECTED_PACKAGE: ${{ inputs.expected_package }}
      TCB_ENV_ID: diversity-123-d9grnqfux221323bb
      CLOUDBASE_REGION: ap-shanghai
      SITE_URL: https://supplychainsai.com
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.13.0', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Build only the public API
        run: pnpm --filter @vibelingan-channel/fn-public-api build
        env: {CHANNEL_BUILD_SHA: '${{ github.sha }}'}
      - run: node scripts/images/package-public-api.mjs
      - name: Select the actual function runtime for the independent package check
        if: ${{ inputs.operation == 'api-only' }}
        uses: actions/setup-node@v4
        with: {node-version: '20.19.0'}
      - name: Check the actual package under Node 20 without calling pnpm
        if: ${{ inputs.operation == 'api-only' }}
        run: node --input-type=module -e "import {readFileSync} from 'node:fs'; import {checkFunctionArchive} from './scripts/release/function-archive.mjs'; checkFunctionArchive(readFileSync('output/image-delivery-package/function.zip'), {smoke:true});"
      - name: Restore Node 22 for the existing deployment tools
        if: ${{ inputs.operation == 'api-only' }}
        uses: actions/setup-node@v4
        with: {node-version: '22.13.0'}
      - name: Archive public-api and apply only the explicitly selected operation
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
        with:
          script: |
            const {spawn} = require('node:child_process');
            await new Promise((resolve,reject) => {
              const child=spawn('./packages/db/node_modules/.bin/tsx',['scripts/images/repair-live.ts'],{stdio:'inherit',env:process.env});
              child.once('error',reject);
              child.once('exit',code=>code===0?resolve():reject(new Error('Image repair stopped; inspect archived stage')));
            });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-delivery-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/image-delivery-live/result.json
          if-no-files-found: ignore
          retention-days: 90
  restore:
    if: ${{ github.ref == 'refs/heads/feat/seo-foundation' && github.event_name == 'workflow_dispatch' && inputs.operation == 'restore' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: test
    env:
      IMAGE_DELIVERY_RESTORE: RESTORE_ARCHIVED_PUBLIC_API_ONLY
      IMAGE_EXPECTED_PACKAGE: ${{ inputs.expected_package }}
      TCB_ENV_ID: diversity-123-d9grnqfux221323bb
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.13.0', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: image-delivery-before-43748962618-1
          run-id: 43748962618
          github-token: ${{ github.token }}
          path: output/image-recovery-source
      - name: Restore the exact archived public API with its Sales integration
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
        with:
          script: |
            const {spawn} = require('node:child_process');
            await new Promise((resolve,reject) => {
              const child=spawn('./packages/db/node_modules/.bin/tsx',['scripts/images/restore-public-api.ts'],{stdio:'inherit',env:process.env});
              child.once('error',reject);
              child.once('exit',code=>code===0?resolve():reject(new Error('Public API recovery stopped; inspect receipt')));
            });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-api-recovery-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/image-recovery/result.json
          if-no-files-found: ignore
          retention-days: 90
