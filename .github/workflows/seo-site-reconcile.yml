name: Reconcile stopped HTML delivery without website writes
on:
  workflow_call:
    inputs:
      source_run_id: {type: string, required: true}
    secrets:
      TENCENTCLOUD_SECRETID: {required: true}
      TENCENTCLOUD_SECRETKEY: {required: true}
permissions:
  contents: read
  actions: read
jobs:
  reconcile:
    if: ${{ github.ref == 'refs/heads/feat/seo-foundation' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: test
    env:
      TCB_ENV_ID: ${{ vars.TCB_ENV_ID }}
      CLOUDBASE_REGION: ${{ vars.CLOUDBASE_REGION || 'ap-shanghai' }}
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_RECONCILE_CONFIRM: STOPPED_HTML_ONLY
      SITE_RECONCILE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: pnpm/action-setup@v4
        with: {version: 11.5.0, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.13.0, cache: pnpm}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify the stopped writer and all pending HTML before reconciling its technical state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
        run: node scripts/run-site-reconcile.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-reconcile-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/site-reconcile/result.json
            output/site-reconcile/release-regional/result.json
          if-no-files-found: error
          retention-days: 90
