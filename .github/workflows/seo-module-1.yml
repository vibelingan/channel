name: SEO module 01 (offline)

on:
  push:
    branches: [feat/seo-foundation]
  pull_request:
    paths:
      - 'scripts/hosting-recovery*'
      - 'scripts/prepare-hosting-recovery*'
      - 'scripts/release/**'
      - 'scripts/release-*.mjs'
      - 'scripts/recovery-kernel.test.mjs'
      - '.github/workflows/seo-module-1.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-module-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Recovery input and kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check repository formatting and lint
        run: pnpm lint
      - name: Run module and existing script regression tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/seo-module-1
          pnpm test:deploy-smoke 2>&1 | tee output/seo-module-1/tests.log
      - name: Retain test results in GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-module-1-${{ github.sha }}
          path: output/seo-module-1/tests.log
          if-no-files-found: warn
          retention-days: 14
