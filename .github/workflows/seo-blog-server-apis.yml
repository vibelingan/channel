name: Prepare Blog API code
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: ${{ github.ref == 'refs/heads/feat/seo-foundation' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: test
    env:
      CI: 'true'
      BLOG_BOOTSTRAP_CONFIRM: BLOG_API_EXPANSION_ONLY
      BLOG_SERVER_API_CONFIRM: CODE_ONLY_NO_FLAGS
      TCB_ENV_ID: diversity-123-d9grnqfux221323bb
      CLOUDBASE_REGION: ap-shanghai
      SITE_URL: https://supplychainsai.com
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.13.0', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Verify the exact tool and application commits before taking source
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/blog/check-api-source.mjs
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.code_sha }}
          path: blog-runtime-source
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
        working-directory: blog-runtime-source
      - name: Fix build identity to the selected application commit
        working-directory: blog-runtime-source
        run: echo "CHANNEL_BUILD_TIME=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
      - run: pnpm package:functions
        working-directory: blog-runtime-source
        env:
          CHANNEL_BUILD_SHA: ${{ steps.source.outputs.code_sha }}
      - uses: actions/setup-node@v4
        with: {node-version: '20.19.0'}
      - run: node scripts/smoke-function-artifacts.mjs
        working-directory: blog-runtime-source
        env:
          CHANNEL_EXPECTED_RELEASE: ${{ steps.source.outputs.code_sha }}
      - uses: actions/setup-node@v4
        with: {node-version: '22.13.0'}
      - name: Archive both actual APIs before any code write
        uses: actions/github-script@v7
        env:
          BLOG_SERVER_API_SOURCE_SHA: ${{ steps.source.outputs.code_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
        with:
          script: |
            const { spawn } = require('node:child_process');
            await new Promise((resolve, reject) => {
              const child = spawn('./apps/site/node_modules/.bin/tsx', ['scripts/blog/bootstrap-apis.ts'], {stdio:'inherit', env:process.env});
              child.once('error', reject);
              child.once('exit', code => code === 0 ? resolve() : reject(new Error(`Controlled API preparation stopped (${code})`)));
            });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blog-server-apis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/blog-server-apis/result.json
            output/blog-server-apis/updates.json
            output/blog-server-apis/resources.json
          retention-days: 90
          if-no-files-found: ignore
