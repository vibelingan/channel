name: SEO Blog isolated dummy
run-name: "Blog dummy ${{ inputs.task_id || 'offline' }}"
on:
  push:
    branches: [feat/seo-foundation]
    paths: ['scripts/blog/**', 'apps/site/src/dummy/**', 'apps/site/astro.blog-dummy.config.ts', '.github/workflows/seo-blog-dummy.yml']
  workflow_dispatch:
    inputs:
      task_id:
        description: Exact queued task in the isolated Blog collections
        type: string
        required: true
      permission_hash:
        description: Exact reviewed permission and OPA hash from the dummy preflight
        type: string
        required: true
      confirm:
        description: Enter ISOLATED_BLOG_ONLY after reviewing the scope and recovery plan
        type: string
        required: true
      fault:
        description: Exercise recovery only after a fully verified B upload; never changes production resources
        type: choice
        options: [none, after-upload]
        default: none
permissions:
  contents: read
  actions: read
jobs:
  offline:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.5.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.13.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec tsc --project scripts/blog/tsconfig.json --noEmit
      - run: node --test scripts/blog-delivery.test.mjs
      - name: Build isolated function and test the actual bundle without cloud credentials
        env:
          CHANNEL_BUILD_SHA: ${{ github.sha }}
        run: |
          pnpm --filter @vibelingan-channel/fn-admin exec tsup --config tsup.blog-dummy.config.ts
          node scripts/blog/function-bundle.integration.mjs
      - run: node scripts/blog/dummy-build.integration.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/blog/dummy-local-ui.mjs
  dummy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/seo-foundation' && inputs.confirm == 'ISOLATED_BLOG_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    concurrency:
      group: cloudbase-deploy-test
      cancel-in-progress: false
    env:
      BLOG_DUMMY_TASK_ID: ${{ inputs.task_id }}
      BLOG_DUMMY_PERMISSION_HASH: ${{ inputs.permission_hash }}
      BLOG_DUMMY_CONFIRM: ${{ inputs.confirm }}
      BLOG_DUMMY_FAULT: ${{ inputs.fault }}
      TCB_ENV_ID: ${{ vars.TCB_ENV_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      CLOUDBASE_REGION: ${{ vars.CLOUDBASE_REGION || 'ap-shanghai' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.sha }}', persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 11.5.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.13.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Freeze input, read accepted backup and build candidate without hosting writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
        run: node --experimental-strip-types scripts/blog/dummy-worker.ts prepare
      - name: Archive exact candidate before upload
        id: payload
        uses: actions/upload-artifact@v4
        with:
          name: blog-dummy-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/blog-dummy/payload/
          if-no-files-found: error
          retention-days: 90
      - name: Deliver isolated pages and verify ordinary URLs; recover only a known completed write
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
          BLOG_DUMMY_ARTIFACT_ID: ${{ steps.payload.outputs.artifact-id }}
        run: node --experimental-strip-types scripts/blog/dummy-worker.ts deliver
      - name: Release a build-only task if a later preparation step failed
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
        run: node --experimental-strip-types scripts/blog/dummy-worker.ts cleanup
      - name: Keep delivery evidence only, without private input or worker credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-dummy-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/blog-dummy/result.json
          if-no-files-found: ignore
          retention-days: 90
