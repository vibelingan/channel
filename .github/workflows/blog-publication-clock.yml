name: Blog publication clock
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: ${{ github.ref == 'refs/heads/main' && vars.BLOG_PUBLICATION_CLOCK_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the tested test branch to inspect its article queue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run deploy-test.yml --ref test \
            -f content_only=true \
            -f article_task_id=auto \
            -f catalog_acceptance_only=false \
            -f catalog_acceptance_scope=full \
            -f run_public_e2e=false \
            -f run_media_upload_smoke=false \
            -f run_oem_upload_smoke=false
