name: Blog publication clock
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: ${{ github.ref == 'refs/heads/main' && vars.BLOG_PUBLICATION_CLOCK_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the verified SEO executor to inspect its article queue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run seo-static-canary.yml --ref feat/seo-foundation \
            -f mode=site-delivery \
            -f action=publish \
            -f variant=A \
            -f artifact_id=auto \
            -f expected_activation_id=none \
            -f reason='Process one queued article from the existing admin'
