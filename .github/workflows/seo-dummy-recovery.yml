name: Isolated real CloudBase recovery drill
on:
  workflow_call:
    inputs:
      operation: {type: string, required: true}
      expected_activation_id: {type: string, required: true}
      restore_run_id: {type: string, required: false, default: ''}
    secrets:
      TENCENTCLOUD_SECRETID: {required: true}
      TENCENTCLOUD_SECRETKEY: {required: true}
permissions:
  contents: read
  actions: read
jobs:
  drill:
    if: ${{ github.ref == 'refs/heads/feat/seo-foundation' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: test
    env:
      TCB_ENV_ID: ${{ vars.TCB_ENV_ID }}
      CLOUDBASE_REGION: ${{ vars.CLOUDBASE_REGION || 'ap-shanghai' }}
      SITE_URL: ${{ vars.SITE_URL }}
      DUMMY_RECOVERY_CONFIRM: ISOLATED_RECOVERY_ONLY
      DUMMY_OPERATION: ${{ inputs.operation }}
      DUMMY_EXPECTED_ACTIVATION: ${{ inputs.expected_activation_id }}
      DUMMY_RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: pnpm/action-setup@v4
        with: {version: 11.5.0, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.13.0, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-node@v4
        with: {node-version: 20.19.0}
      - name: Verify the standalone real SDK bundle on the deployed runtime before any cloud writes
        run: node --test scripts/release-drill/build.integration.test.mjs
      - uses: actions/setup-node@v4
        with: {node-version: 22.13.0}
      - name: Exercise only the fixed temporary function and private test records
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
        with:
          script: |
            const {spawn} = require('node:child_process');
            await new Promise((resolve,reject) => {
              const child=spawn('node',['scripts/release-drill/run.mjs'],{stdio:'inherit',env:process.env});
              child.once('error',reject);
              child.once('exit',code=>code===0?resolve():reject(new Error('Isolated drill stopped; inspect its result before another write')));
            });
      - name: Retain actual results without credentials or configuration values
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-drill-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/recovery-drill/result.json
          if-no-files-found: ignore
          retention-days: 90
