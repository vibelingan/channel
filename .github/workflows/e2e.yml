name: E2E

on:
  workflow_dispatch:
    inputs:
      suite:
        description: E2E suite to run
        required: true
        type: choice
        default: public
        options:
          - public
          - catalog-category
          - admin
          - mutation
          - media-upload
          - bootstrap

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ inputs.suite }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Run ${{ inputs.suite }} E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: test

    env:
      CI: 'true'
      TCB_ENV_ID: ${{ vars.TCB_ENV_ID }}
      E2E_SITE_URL: ${{ vars.SITE_URL || format('https://channel-test-{0}.webapps.tcloudbase.com', vars.TCB_ENV_ID) }}
      E2E_API_URL: ${{ vars.PUBLIC_API_BASE_URL || format('https://{0}.service.tcloudbase.com', vars.TCB_ENV_ID) }}
      E2E_ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL || 'admin@channel.local' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public E2E suite
        if: ${{ inputs.suite == 'public' || inputs.suite == 'catalog-category' }}
        run: |
          case "${{ inputs.suite }}" in
            public) pnpm test:e2e:public ;;
            catalog-category) pnpm test:e2e:catalog ;;
          esac

      - name: Run credentialed E2E suite
        if: ${{ inputs.suite == 'admin' || inputs.suite == 'mutation' || inputs.suite == 'media-upload' }}
        env:
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          if [ -z "$E2E_ADMIN_PASSWORD" ]; then
            echo "E2E_ADMIN_PASSWORD secret is not set for the test environment" >&2
            exit 1
          fi
          case "${{ inputs.suite }}" in
            admin)
              npx playwright test tests/e2e/admin-auth.spec.ts
              pnpm test:e2e:catalog-admin
              ;;
            mutation)
              E2E_ALLOW_MUTATION=1 npx playwright test tests/e2e/mutation.spec.ts
              ;;
            media-upload)
              E2E_MEDIA_UPLOAD_SMOKE=1 pnpm test:e2e:media-upload
              ;;
          esac

      - name: Run bootstrap E2E suite
        if: ${{ inputs.suite == 'bootstrap' }}
        env:
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_BOOTSTRAP_ADMIN_TOKEN: ${{ secrets.BOOTSTRAP_ADMIN_TOKEN }}
        run: |
          if [ -z "$E2E_ADMIN_PASSWORD" ] || [ -z "$E2E_BOOTSTRAP_ADMIN_TOKEN" ]; then
            echo "Bootstrap E2E credentials are not set for the test environment" >&2
            exit 1
          fi
          E2E_ENABLE_BOOTSTRAP=1 npx playwright test tests/e2e/bootstrap.spec.ts
