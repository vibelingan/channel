<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Assistant — local development</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --panel: #fff; --ink: #16181d; --muted: #6b7280;
    --line: #e4e6eb; --accent: #2563eb; --accent-ink: #fff;
    --visitor: #eef2ff; --warn-bg: #fff7ed; --warn-ink: #9a3412; --warn-line: #fed7aa;
    --err-bg: #fef2f2; --err-ink: #991b1b; --err-line: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1014; --panel: #16181d; --ink: #e8eaed; --muted: #9aa0a6;
      --line: #2a2d34; --visitor: #1e2436; --warn-bg: #2a1c0d; --warn-ink: #fdba74;
      --warn-line: #7c2d12; --err-bg: #2a1213; --err-ink: #fca5a5; --err-line: #7f1d1d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 24px 16px;
  }
  main { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 14px; }
  header h1 { font-size: 17px; margin: 0 0 2px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  .banner {
    background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-line);
    border-radius: 10px; padding: 9px 12px; font-size: 12.5px;
  }
  #log {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; min-height: 320px; display: flex; flex-direction: column; gap: 14px;
  }
  .empty { color: var(--muted); font-size: 13.5px; margin: auto; text-align: center; }
  .empty button {
    display: block; margin: 8px auto 0; background: none; border: 1px solid var(--line);
    color: var(--accent); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; cursor: pointer;
  }
  .turn { display: flex; flex-direction: column; gap: 6px; }
  .who { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .bubble { border-radius: 12px; padding: 10px 13px; white-space: pre-wrap; word-wrap: break-word; }
  .visitor .bubble { background: var(--visitor); align-self: flex-end; max-width: 85%; }
  .assistant .bubble { background: transparent; padding-left: 0; }
  .assistant.thinking .bubble::after {
    content: "▍"; animation: blink 1s steps(2) infinite; color: var(--muted);
  }
  @keyframes blink { 50% { opacity: 0; } }
  .cites { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .cites a {
    font-size: 12px; color: var(--accent); text-decoration: none;
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--panel);
  }
  .cites a:hover { text-decoration: underline; }
  .err {
    background: var(--err-bg); color: var(--err-ink); border: 1px solid var(--err-line);
    border-radius: 10px; padding: 9px 12px; font-size: 13px;
  }
  form { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; padding: 11px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font: inherit;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary {
    padding: 11px 20px; border-radius: 999px; border: 0;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer;
  }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.stop { background: #b91c1c; }
  footer { color: var(--muted); font-size: 12px; text-align: center; }
</style>

<main>
  <header>
    <h1>Diversity Technology — customer assistant</h1>
    <p>Local development harness. Answers are grounded in the website's own content.</p>
  </header>

  <div class="banner" id="banner">Checking the assistant…</div>

  <div id="log">
    <div class="empty" id="empty">
      Ask something a customer would ask.
      <button type="button" data-q="What is your minimum order quantity for headphones?">What's your MOQ for headphones?</button>
      <button type="button" data-q="What does your OEM development process look like?">What's your OEM process?</button>
      <button type="button" data-q="Where is your factory and how long have you been operating?">Where's your factory?</button>
    </div>
  </div>

  <form id="form">
    <input type="text" id="input" autocomplete="off" placeholder="Ask about MOQ, lead times, certifications…" />
    <button type="submit" class="primary" id="send">Send</button>
  </form>

  <footer id="foot"></footer>
</main>

<script type="module">
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const banner = document.getElementById('banner');
  const empty = document.getElementById('empty');
  const foot = document.getElementById('foot');

  /** Full turn history, so follow-up questions carry context. */
  const history = [];
  let controller = null;

  // Readiness up front: an assistant that silently cannot answer is worse than
  // one that says so before you type a question into it.
  fetch('/api/ai/readyz')
    .then((r) => r.json())
    .then((r) => {
      banner.textContent = r.ok
        ? `Store ${r.store} · transaction ${r.txn} · ${r.isolation}. Development harness — the run lifecycle and human takeover are not wired up yet.`
        : 'The assistant is not ready.';
    })
    .catch(() => { banner.textContent = 'Could not reach the assistant.'; });

  empty.addEventListener('click', (e) => {
    const q = e.target.dataset?.q;
    if (q) { input.value = q; form.requestSubmit(); }
  });

  function addTurn(role, text) {
    empty.remove?.();
    const wrap = document.createElement('div');
    wrap.className = `turn ${role}`;
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = role === 'visitor' ? 'You' : 'Assistant';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.append(who, bubble);
    log.append(wrap);
    log.scrollIntoView({ block: 'end' });
    return { wrap, bubble };
  }

  function showCitations(wrap, citations) {
    if (!citations.length) return;
    const box = document.createElement('div');
    box.className = 'cites';
    // Title and link only. The snippet is the raw retrieved chunk and reads
    // like debug output; the page is what a customer can actually go and read.
    for (const c of citations) {
      const a = document.createElement('a');
      a.textContent = c.title;
      a.href = c.url ?? '#';
      a.target = '_blank';
      a.rel = 'noopener';
      box.append(a);
    }
    wrap.append(box);
  }

  function showError(text) {
    const box = document.createElement('div');
    box.className = 'err';
    box.textContent = text;
    log.append(box);
  }

  function setBusy(busy) {
    send.textContent = busy ? 'Stop' : 'Send';
    send.classList.toggle('stop', busy);
    input.disabled = busy;
  }

  send.addEventListener('click', (e) => {
    if (controller) { e.preventDefault(); controller.abort(); }
  });

  // Enter submits, explicitly. The form would do this implicitly, but the
  // button doubles as Stop mid-stream, and relying on implicit submission
  // through a dual-purpose button leaves the behaviour to chance.
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !controller) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (controller) return;
    const message = input.value.trim();
    if (!message) return;

    addTurn('visitor', message);
    input.value = '';
    const { wrap, bubble } = addTurn('assistant', '');
    wrap.classList.add('thinking');
    setBusy(true);
    foot.textContent = '';

    controller = new AbortController();
    const started = performance.now();
    let answer = '';
    const citations = [];

    try {
      const res = await fetch('/api/ai/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ message, history }),
        signal: controller.signal,
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body?.error?.message ?? `HTTP ${res.status}`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let firstTokenAt = null;

      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let cut;
        while ((cut = buffer.indexOf('\n\n')) !== -1) {
          const block = buffer.slice(0, cut);
          buffer = buffer.slice(cut + 2);
          const line = block.split('\n').find((l) => l.startsWith('data:'));
          if (!line) continue;
          let event;
          try { event = JSON.parse(line.slice(5).trim()); } catch { continue; }

          if (event.type === 'token') {
            firstTokenAt ??= performance.now();
            answer += event.text;
            bubble.textContent = answer;
            log.scrollIntoView({ block: 'end' });
          } else if (event.type === 'citation') {
            citations.push(event.citation);
          } else if (event.type === 'final') {
            wrap.classList.remove('thinking');
            showCitations(wrap, citations.length ? citations : event.citations);
            const total = Math.round(performance.now() - started);
            const ttft = firstTokenAt ? Math.round(firstTokenAt - started) : null;
            foot.textContent = `${ttft !== null ? `first token ${ttft}ms · ` : ''}total ${total}ms · ${citations.length} source(s)`;
          } else if (event.type === 'error') {
            wrap.classList.remove('thinking');
            showError(`The assistant could not answer (${event.category}${event.retriable ? ', worth retrying' : ''}).`);
          }
        }
      }

      history.push({ role: 'visitor', text: message });
      if (answer) history.push({ role: 'assistant', text: answer });
    } catch (err) {
      wrap.classList.remove('thinking');
      if (err.name === 'AbortError') {
        bubble.textContent = answer + (answer ? ' ' : '') + '[stopped]';
      } else {
        showError(err.message);
      }
    } finally {
      controller = null;
      setBusy(false);
      input.focus();
    }
  });

  input.focus();
</script>
